name: collect

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = KST 06:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 전에 한 번 훑는다. **빨갛게 만들지 않는다** — 안 쓰는 변수 하나로
      # 그날 데이터가 통째로 안 들어오면 손해가 더 크다. 요약에만 적는다.
      #
      # 오늘(2026-10-08) 터진 `gone` 섀도잉은 타입이 달라 pyflakes 가 못 잡는다.
      # 그래도 **정의 안 된 이름**은 잡는데, 그건 걸리면 수집이 통째로 죽는
      # 종류라 미리 아는 값이 크다. 실제로 돌려 보니 죽은 코드 셋도 나왔다.
      - name: 코드 점검 (pyflakes)
        continue-on-error: true
        run: |
          pip install pyflakes
          pyflakes collect.py doctor.py rules.py taxonomy.py social.py \
                   web/*.py collectors/*.py | tee lint.txt || true
          if [ -s lint.txt ]; then
            { echo '### pyflakes'; echo '```'; cat lint.txt; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: python collect.py
        env:
          # 한국 IP 를 거쳐 나가고 싶으면 저장소 Secrets 에 SINSANG_PROXY 를
          # 넣는다(예: http://user:pass@호스트:포트). 비어 있으면 러너에서
          # 그대로 나간다 — 그러면 한국 사이트 여럿이 해외 IP 라고 막는다.
          # 사유는 collectors/base.py 의 PROXY 주석 참고.
          SINSANG_PROXY: ${{ secrets.SINSANG_PROXY }}

      - name: commit & push
        if: always()          # 일부 어댑터가 죽어도 나머지는 반영
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs notes
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "수집 $(date -u -d '+9 hours' +%Y-%m-%d)"
            # ⚠️ 그냥 push 하면 터진다. 2026-10-08 에 수동 실행과 예약 실행이
            #    5분 차이로 겹쳐 뒤엣것이 non-fast-forward 로 거절됐다.
            #    수집은 다 해 놓고 마지막에 못 올리는 게 제일 아깝다.
            git pull --rebase --autostash
            git push
          fi
